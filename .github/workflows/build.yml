name: build

on:
  push:
    branches: [ main, 'arena/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Создать GitHub Release с собранным exe'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка ServerHealth.exe (win-x64)
    runs-on: windows-latest
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Установка .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Восстановление пакетов
        run: dotnet restore src/ServerHealth/ServerHealth.csproj

      - name: Публикация (один самодостаточный exe)
        shell: pwsh
        run: |
          $ver = "1.1.$($env:GITHUB_RUN_NUMBER)"
          dotnet publish src/ServerHealth/ServerHealth.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:DebugSymbols=false `
            -p:Version=$ver `
            -o out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem out | Format-Table Name, Length

      - name: Контрольная сумма SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash -Algorithm SHA256 out\ServerHealth.exe).Hash.ToLower()
          "$h  ServerHealth.exe" | Out-File -Encoding ascii out\SHA256SUMS.txt
          Get-Content out\SHA256SUMS.txt

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: ServerHealth-win-x64
          path: |
            out/ServerHealth.exe
            out/SHA256SUMS.txt
          retention-days: 90
          if-no-files-found: error

      - name: Релиз (при пуше тега v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$($env:GITHUB_REF_NAME)" `
            --title "ServerHealth $($env:GITHUB_REF_NAME)" `
            --notes "Собранный ServerHealth.exe (win-x64, самодостаточный). Проверка: SHA256SUMS.txt. Инструкции — в README.md." `
            out/ServerHealth.exe out/SHA256SUMS.txt

      - name: Релиз (ручной запуск с create_release = true)
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.$($env:GITHUB_RUN_NUMBER)"
          gh release create $tag `
            --target $env:GITHUB_SHA `
            --title "ServerHealth $tag" `
            --notes "Собранный ServerHealth.exe (win-x64, самодостаточный). Проверка: SHA256SUMS.txt. Инструкции — в README.md." `
            out/ServerHealth.exe out/SHA256SUMS.txt
